<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Instagram — возврат в Shorts Bot</title>
<style>
  body { margin: 0; padding: 24px; font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f7f9; color: #111; }
  .card { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 22px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: #444; }
  .actions { display: grid; gap: 10px; margin: 18px 0 6px; }
  a.button { display: block; text-align: center; text-decoration: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; }
  a.primary { background: #0071e3; color: #fff; }
  a.secondary { background: #eef1f6; color: #1b1b1f; }
  code { background: #f0f2f5; border-radius: 6px; padding: 1px 5px; font-size: 13px; }
  .muted { color: #6e6e73; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Возвращаю в Shorts Bot</h1>
    <p>Meta вернула код авторизации. Выберите, куда его передать.</p>
    <div class="actions">
      <a class="button primary" id="link-8765" href="#">Открыть Shorts Bot (порт 8765)</a>
      <a class="button secondary" id="link-8768" href="#">Открыть тестовую копию (порт 8768)</a>
    </div>
    <p class="muted">Обычно нужна первая кнопка. Вторая — только для копии, где идёт разработка.</p>
    <p class="muted" id="target"></p>
  </div>
  <script>
    const query = location.search || "";
    const targets = {
      "link-8765": "http://127.0.0.1:8765/api/instagram/oauth/callback" + query,
      "link-8768": "http://127.0.0.1:8768/api/instagram/oauth/callback" + query
    };
    Object.keys(targets).forEach(function (id) {
      const el = document.getElementById(id);
      el.href = targets[id];
    });
    document.getElementById("target").textContent = targets["link-8765"];
  </script>
</body>
</html>
